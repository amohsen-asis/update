mode: ContinuousDelivery
assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatchTag
assembly-informational-format: '{MajorMinorPatch}'

# Starting version
next-version: 1.0.0

# Version increment rules
major-version-bump-message: '^(breaking|major):'  # Breaking changes that are not backwards compatible
minor-version-bump-message: '^(feature|minor|feat):'  # New features that are backwards compatible
patch-version-bump-message: '^(fix|patch|bugfix):'  # Bug fixes and patches
no-bump-message: '^(none|skip|docs|style|refactor|test|chore):'  # Changes that don't affect versioning

branches:
  main:
    regex: ^master$|^main$
    mode: ContinuousDelivery
    increment: None  # Don't increment version on main
    prevent-increment-of-merged-branch-version: true  # Keep version stable
    is-release-branch: true
  develop:
    regex: ^dev(elop)?(ment)?$
    mode: ContinuousDeployment
    increment: Minor  # Feature development happens in develop branch
    is-release-branch: false
  feature:
    regex: ^features?[/-]
    mode: ContinuousDeployment
    increment: Minor
    source-branches: ['main']
  hotfix:
    regex: ^hotfix(es)?[/-]
    increment: Patch
    source-branches: ['main']
    is-release-branch: false 